; NFCTapInXR_AtomMatrix_proto1 — M5 ATOM Matrix + PN532 NFC Module V3 (red board)
; over its serial (HSU) mode. Reads ISO14443A cards/tags and sends "TAP <uid>" over the Nordic UART
; service (no bonding), so SpecsSwitchbackXR-style lenses can subscribe directly.

[platformio]
default_envs = atom_matrix

[env:atom_matrix]
platform = espressif32@6.9.0
framework = arduino
board = m5stack-atom
monitor_speed = 115200
upload_speed = 1500000   ; M5's documented speed; drop to 115200 if uploads fail
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  https://github.com/h2zero/NimBLE-Arduino.git#2.2.2   ; same version as the HeadLight ATOM sketches
  https://github.com/FastLED/FastLED.git#3.9.11       ; same version as the HeadLight ATOM sketches
