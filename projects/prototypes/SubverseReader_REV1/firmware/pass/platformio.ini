; SubverseReader pass firmware: one tree, three builds.
;
;   sr15     SR-15 Dial Pass: Elecrow CrowPanel ESP32 4.2in E-Paper HMI (ESP32-S3, microSD,
;            thumb dial + MENU + EXIT).
;   sr16_s3  SR-16 Setlist on a XIAO ESP32-S3: Seeed XIAO ePaper driver board + Elecrow's bare
;            3.7in 240x416 panel, packs in flash, three keys or none.
;   sr16_c5  the same on a XIAO ESP32-C5. The C5 needs ESP-IDF 5.5, so this build uses the
;            pioarduino platform; the other two stay on the toolchain maplet and goggl1 use.
;
;   pio run -e sr15 -t upload        pio run -e sr16_s3 -t upload        pio run -e sr16_c5 -t upload

[platformio]
default_envs = sr15

[env]
framework = espidf
monitor_speed = 115200
monitor_filters = direct
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24

[env:sr15]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
upload_speed = 460800          ; the board's CH340C drops bytes above this
board_build.cmake_extra_args =
  -DPASS_BOARD=sr15
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.sr15"

[env:sr16_s3]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
board = seeed_xiao_esp32s3
board_build.partitions = partitions_sr16.csv
upload_speed = 115200          ; the S3's USB serial port on macOS drops the data phase at 460800
board_build.cmake_extra_args =
  -DPASS_BOARD=sr16
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.sr16_s3"

[env:sr16_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_sr16.csv
board_build.cmake_extra_args =
  -DPASS_BOARD=sr16
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.sr16_c5"
