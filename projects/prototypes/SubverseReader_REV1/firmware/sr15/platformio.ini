; SubverseReader SR-15 Dial Pass: Elecrow CrowPanel ESP32 4.2in E-Paper HMI
; (ESP32-S3-WROOM-1 N8R8, SSD1683 400x300, microSD, thumb dial + MENU + EXIT).
; Same toolchain pins as maplet / goggl1 / ESPIDFORTH.
;   pio run -t upload && pio device monitor

[platformio]
default_envs = crowpanel42

[env:crowpanel42]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
upload_speed = 460800          ; the board's CH340C drops bytes above this
monitor_speed = 115200
monitor_filters = direct
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24
