; scout_m5camera_espidforth: Scout, a second camera for LightScopeXR, on an
; M5Camera (PSRAM) Model B: ESP32-D0WDQ6 rev 1, 4 MB flash, 4 MB PSRAM,
; OV2640, CP2104 bridge. Same toolchain pins as AlphaFriend / maplet.

[platformio]
default_envs = m5camera_b

[env:m5camera_b]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
board = esp32dev
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24
