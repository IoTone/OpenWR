; NFCTapInXR_StampS3Bat_proto1 — Arduino bring-up for an Adafruit PN532 shield (789)
; on an M5 Stamp-S3Bat DIP. Proves wiring, the switched 5 V rail and card reads
; before the reader moves into an ESPIDFORTH build.
;
; There is no Stamp-S3Bat board in PlatformIO; the StampS3 definition matches its
; 8 MB flash and native USB. PSRAM is left off; this sketch does not need it.

[platformio]
default_envs = stamps3bat

[env:stamps3bat]
platform = espressif32@6.9.0
framework = arduino
board = m5stack-stamps3
monitor_speed = 115200
upload_speed = 115200   ; the S3 USB-serial-JTAG on macOS drops the data phase at 460800 (maplet)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  https://github.com/m5stack/M5PM1.git#1.0.7
