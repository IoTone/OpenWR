; esp32c3_beetle_goggl1 — ESPIDFORTH on a DFRobot Beetle ESP32-C3 (DFR0868)
; driving a Fermion SSD1309 1.51" transparent OLED (DFR0934) over the GDI
; ribbon connector.
;
; The platform / framework pins are the same ones ESPIDFORTH uses, so this
; builds with the toolchain that repo already verified on ESP32-C3 hardware.

[platformio]
default_envs = beetle_c3

[env:beetle_c3]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
board = dfrobot_beetle_esp32c3
monitor_speed = 115200
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
