; alpha-fairy-espidforth: AlphaFriend, Alpha Fairy's Sony camera code on
; ESPIDFORTH, for an M5StickC Plus SE (ESP32-PICO-D4, 4 MB flash, no PSRAM).
; Same toolchain pins as goggl1 / maplet / ESPIDFORTH.

[platformio]
default_envs = stickc_plus_se

[env:stickc_plus_se]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
board = m5stick-c
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 750000
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24
