; maplet_xiao_eink — ESPIDFORTH on a Seeed XIAO ESP32C3 with the XIAO
; ePaper Breakout Board and the 2.13" flexible monochrome panel (212x104).
; Same toolchain pins as goggl1 / ESPIDFORTH.

[platformio]
default_envs = xiao_c3

[env:xiao_c3]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
board = seeed_xiao_esp32c3
monitor_speed = 115200
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
