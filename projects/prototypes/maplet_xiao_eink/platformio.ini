; maplet_xiao_eink — ESPIDFORTH on a Seeed XIAO ESP32S3 Sense (primary) or
; XIAO ESP32C3 with the XIAO ePaper Breakout Board and the 2.13" flexible
; monochrome panel (212x104).
; Same toolchain pins as goggl1 / ESPIDFORTH.

[platformio]
default_envs = xiao_s3_sense

[common]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
monitor_speed = 115200
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24

[env:xiao_s3_sense]
extends = common
board = seeed_xiao_esp32s3
upload_speed = 115200   ; the S3 USB-serial-JTAG on macOS drops the data phase at 460800
board_build.partitions = partitions_s3.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3"

[env:xiao_c3]
extends = common
board = seeed_xiao_esp32c3
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c3"
