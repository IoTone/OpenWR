; reelhub_wavec6touch_espidforth: ReelHub, the LightScopeXR shot hub, on a
; Waveshare ESP32-C6-Touch-LCD-1.47 (ESP32-C6FH8 rev v0.2, 8 MB flash, no
; PSRAM, JD9853 172x320 LCD, AXS5106L touch). Same toolchain pins as Scout,
; AlphaFriend and goggl1. The C6FH8 needs IDF >= 5.1.4; this is 5.3.1.

[platformio]
default_envs = wavec6touch

[env:wavec6touch]
platform = espressif32@6.9.0
platform_packages =
  framework-espidf @ 3.50301.0
framework = espidf
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
  -DESPIDFORTH_ENABLE_TESTS=0
  -DMAX_WORDS=400
  -DMAX_WORD_LEN=24
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
