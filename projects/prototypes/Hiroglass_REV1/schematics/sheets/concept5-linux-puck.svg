<text x="832.0" y="660.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f6f8b" text-anchor="start">Why the adapter</text>
<text x="832.0" y="680.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">The Pi 5's USB-C port is power-only: no DisplayPort alt mode. Birdbath</text>
<text x="832.0" y="696.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">glasses need DP over USB-C plus 5 V, hence the powered HDMI adapter.</text>
<text x="832.0" y="712.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">ROCK 5B instead: its USB-C carries DP alt mode, so the glasses plug in</text>
<text x="832.0" y="728.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">directly and the adapter goes away (needs ~30 W PD; not at DigiKey/Mouser).</text>
<rect x="820.0" y="790.0" width="700.0" height="102.0" rx="4" fill="#eef5f8" stroke="#1f6f8b" stroke-width="1.1"/>
<text x="832.0" y="810.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f6f8b" text-anchor="start">Software path</text>
<text x="832.0" y="830.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">XRLinuxDriver (GPL-3.0) or Monado's own driver for the glasses, 3DoF first.</text>
<text x="832.0" y="846.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">Write a Monado driver for the IMU bridge: it is the same driver the</text>
<text x="832.0" y="862.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">monocular Pod-0 needs later over its own USB-C (binocular hook).</text>
<text x="832.0" y="878.0" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1b232c" text-anchor="start">6DoF: Basalt on the stereo pair; benchmark CPU load before choosing the SoC.</text>
</svg>
