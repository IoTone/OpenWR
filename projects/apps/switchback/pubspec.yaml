name: switchback
description: "Switchback — the OpenWR app. Pair, set up, dress and update your goggl1 over Bluetooth, and run sessions with the glass in front of your eye."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Core / UI ---
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.3

  # --- App metadata ---
  package_info_plus: ^8.1.0
  device_info_plus: ^11.2.0

  # --- State management ---
  provider: ^6.1.2

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Localization (EN + JA) ---
  intl: ^0.20.2

  # --- Bluetooth LE scan + connect ---
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

  # --- WiFi scanning (Android full; iOS connected-network only) ---
  wifi_scan: ^0.4.1+2
  network_info_plus: ^6.1.1

  # --- Settings persistence ---
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Code-gen the AppLocalizations class from lib/l10n/*.arb at build
  # time. See l10n.yaml for the template + output paths.
  generate: true

  assets:
    - assets/images/glass/theme-strip.png
    - assets/images/glass/theme-glance.png
    - assets/images/glass/theme-ribbon.png
    - assets/images/icon-192.png
    - assets/images/switchback-icon-512.png
    - assets/images/switchback-splash.png

  # Brand type (all OFL): Bricolage Grotesque for display, Atkinson
  # Hyperlegible for body, IBM Plex Mono for data — the glass is mono too.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# App icons for every platform. Regenerate the source art with
#   python3 tool/gen_icon.py
# then  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/switchback-icon-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true          # the App Store rejects alpha channels
  macos:
    generate: true
    image_path: "assets/images/switchback-icon-1024.png"
  web:
    generate: true
    background_color: "#F3F4F1"
    theme_color: "#F3F4F1"
  windows:
    generate: true
    icon_size: 256

# Launch screen: the switchback mark on the same Fog field the icon uses,
# so the splash and the icon read as one thing.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F3F4F1"
  image: assets/images/switchback-splash.png
  color_dark: "#F3F4F1"
  image_dark: assets/images/switchback-splash.png
  android_12:
    image: assets/images/switchback-splash.png
    color: "#F3F4F1"
    icon_background_color: "#F3F4F1"
  ios: true
  android: true
  web: false
